name: Subgraph CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'pop-subgraph/**'
      - 'peer-cashoutrelay-base/**'
      # The wasm-start guard and the workflow itself gate every deploy, so a change to
      # either must run CI. Without these, a typo in check-wasm-start.mjs merges green
      # and silently disables the guard.
      - 'scripts/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'pop-subgraph/**'
      - 'peer-cashoutrelay-base/**'
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  # A module-level global initialised by a host call makes graph-node's allocator hand out
  # an arena on top of the static data segment, so string literals read back empty and
  # indexing dies on the first trigger — blamed on an unrelated handler. It compiles, it
  # passes matchstick and it passes subgraph-lint, so it needs its own gate. This checks the
  # built artifact rather than the source, which is why indirection cannot slip past it.
  # See scripts/check-wasm-start.mjs.
  wasm-start-guard:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [pop-subgraph, peer-cashoutrelay-base]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: ${{ matrix.dir }}/yarn.lock
      - run: yarn install --frozen-lockfile
        working-directory: ${{ matrix.dir }}
      - run: yarn codegen
        working-directory: ${{ matrix.dir }}
      - run: yarn build
        working-directory: ${{ matrix.dir }}
      - run: node ../scripts/check-wasm-start.mjs build
        working-directory: ${{ matrix.dir }}

  # The three deploy jobs below call a reusable workflow in another org and hand it
  # GRAPH_DEPLOY_KEY, so it is pinned to an immutable SHA rather than a branch ref. The pin
  # is the head of BreadchainCoop/subgraphform@hudsonhrh/add-network-input as of 2026-03-12;
  # that branch carries the `network:` input, which does not exist on its main. Re-pin
  # deliberately when picking up upstream changes — a mutable ref here would let changed
  # third-party workflow code run with our deploy key.
  subgraph-arbitrum-one:
    needs: wasm-start-guard
    uses: BreadchainCoop/subgraphform/.github/workflows/_subgraph-cicd.yml@bea1f2bc96a6c24fd44714bd799004c63e317b09
    with:
      subgraph-name: poa-arb-v-1
      working-directory: pop-subgraph
      network: arbitrum-one
    secrets:
      GRAPH_DEPLOY_KEY: ${{ secrets.GRAPH_DEPLOY_KEY }}

  subgraph-gnosis:
    needs: wasm-start-guard
    uses: BreadchainCoop/subgraphform/.github/workflows/_subgraph-cicd.yml@bea1f2bc96a6c24fd44714bd799004c63e317b09
    with:
      subgraph-name: poa-gnosis-v-1
      working-directory: pop-subgraph
      network: gnosis
      # run-tests stays enabled: matchstick is network-agnostic, and there is no cross-job
      # dependency between the deploy jobs, so disabling it here would let a test failure
      # block only the Arbitrum deploy while broken mappings still shipped to Gnosis.
    secrets:
      GRAPH_DEPLOY_KEY: ${{ secrets.GRAPH_DEPLOY_KEY }}

  subgraph-base:
    needs: wasm-start-guard
    uses: BreadchainCoop/subgraphform/.github/workflows/_subgraph-cicd.yml@bea1f2bc96a6c24fd44714bd799004c63e317b09
    with:
      subgraph-name: peer-cashoutrelay-base
      working-directory: peer-cashoutrelay-base
      network: base
    secrets:
      GRAPH_DEPLOY_KEY: ${{ secrets.GRAPH_DEPLOY_KEY }}
